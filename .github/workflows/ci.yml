name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      only_testing:
        description: "要跑的测试，空格分隔，例如 PalmhelmMacTests/NotchIslandTests；留空跑全部"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS build (unsigned)
    # 公开仓库，但本 App 要求 Xcode 27（托管 macos-latest 是 Xcode 26.6，
    # MainWindow.swift 的 SwiftUI 表达式会 type-check 超时）。因此跑在本机自托管 macOS
    # runner 上，并守住「fork PR 不上本机」：来自 fork 的 PR 跳过本 job。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos, arm64, xcode]
    steps:
      - uses: actions/checkout@v7

      # project.yml 把内置 Bridge 单文件当资源，且 xcodegen 会校验这些文件必须存在：
      # 顺序必须是 bundle-bridge.sh → xcodegen generate → xcodebuild。
      - name: bundle bridge
        run: sh scripts/bundle-bridge.sh

      - name: xcodegen generate
        run: xcodegen generate

      - name: xcodebuild build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PalmhelmMac.xcodeproj \
            -scheme PalmhelmMac \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -200

      # 测试宿主用独立 bundle id（scripts/test-mac.sh），ad-hoc 签名；手动触发的 only_testing 经环境变量传入。
      - name: xcodebuild test
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          set -o pipefail
          args=""
          for t in ${ONLY_TESTING:-}; do args="$args -only-testing:$t"; done
          sh scripts/test-mac.sh \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-test" \
            -test-timeouts-enabled YES \
            CODE_SIGN_IDENTITY=- $args 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log" | tail -300

      # tail 只保留末尾；失败时从完整日志里列出失败的用例与断言位置。
      - name: list test failures
        if: failure()
        run: |
          grep -E "error: |' failed \(" "$RUNNER_TEMP/xcodebuild-test.log" | head -200 || true
