name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS build (unsigned)
    # 公开仓库：用 GitHub 托管的 macOS runner（公开仓库免费），本机 runner 不接公开仓库。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # project.yml 把内置 Bridge 单文件当成资源，必须先跑脚本取回并校验（不入库）。
      - name: bundle bridge
        run: sh scripts/bundle-bridge.sh

      - name: xcodegen generate
        run: xcodegen generate

      - name: xcodebuild build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PalmhelmMac.xcodeproj \
            -scheme PalmhelmMac \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -200
